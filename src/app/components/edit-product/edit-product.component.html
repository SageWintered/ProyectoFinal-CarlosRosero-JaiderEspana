<div class="page-wrapper">
  <p-card class="edit-card">
    <div class="inner-container">
      
      <h2 class="title">Editar Producto</h2>

      <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="form">

        <div class="form-group">
          <label>Nombre:</label>
          <input pInputText type="text" formControlName="name" />
        </div>

        <div class="form-group">
          <label>Precio:</label>
          <input pInputText type="number" formControlName="price" />
        </div>

        <div class="form-group">
          <label>Categoría:</label>
          <p-dropdown 
            [options]="categories"
            optionLabel="label"
            optionValue="value"
            formControlName="category">
          </p-dropdown>
        </div>

        <div class="form-group">
          <label>Imagen (URL):</label>
          <input pInputText type="text" formControlName="img" />
        </div>

        <div class="preview">
          <p>Vista previa:</p>
          <img [src]="editForm.value.img" alt="Vista previa" />
        </div>

        <button pButton 
                type="submit" 
                label="Actualizar" 
                class="update-btn">
        </button>

      </form>

    </div>
  </p-card>
</div>
